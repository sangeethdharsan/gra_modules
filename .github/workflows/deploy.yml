name: Trigger Parent Update

on:
  push:
    branches: 
      - main
      - reusable-gra
    paths: 
      - 'composer.json'
      - 'composer.lock'

jobs:
  notify-parent:
    runs-on: ubuntu-latest
    steps:
      # Get current commit SHA
      - name: Get SHA
        id: get-sha
        run: echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # Trigger parent workflow via API
      - name: Trigger gra_2 update
        env:
          GH_TOKEN: ${{ secrets.PAT }}  # PAT with repo+workflow scope
        run: |
          curl -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/sangeethdharsan/gra_2/actions/workflows/dispatch-workflow.yml/dispatches" \
            -d '{
              "ref": "reuse-test",
              "inputs": {
                "child_sha": "${{ env.SHA }}"
              }
            }'
