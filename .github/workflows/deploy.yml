name: Trigger Parent Update

on:
  push:
    branches: 
      - main
      - reusable-gra
    paths: 
      - 'composer.json'
      - 'composer.lock'

jobs:
  notify-parent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get current commit SHA
        run: echo "SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      - name: Trigger parent workflow
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          curl -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/sangeethdharsan/gra_2/actions/workflows/dispatch-workflow.yml/dispatches" \
            -d '{
              "ref": "reuse-test",
              "inputs": {
                "child_sha": "${{ env.SHA }}"
              }
            }'
