name: Reusable: Update Parent Repo

on:
  workflow_call:
    inputs:
      parent_repo:
        required: true
        type: string
      parent_branch:
        required: true
        type: string
      child_repo:
        required: true
        type: string
      child_branch:
        required: true
        type: string
    secrets:
      PAT:
        required: true

jobs:
  update-parent:
    runs-on: ubuntu-latest
    steps:
      # Checkout child repo
      - name: Checkout Child Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.child_repo }}
          token: ${{ secrets.PAT }}
          ref: ${{ inputs.child_branch }}

      # Get current commit SHA
      - name: Get Commit SHA
        id: get-sha
        run: echo "COMMIT_SHA=$(git rev-parse HEAD)" >> $GITHUB_ENV

      # Checkout parent repo
      - name: Checkout Parent Repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.parent_repo }}
          path: parent_repo
          token: ${{ secrets.PAT }}
          ref: ${{ inputs.parent_branch }}

      # Update composer reference
      - name: Update composer.json
        run: |
          cd parent_repo
          composer config repositories.child_repo '{
            "type": "git",
            "url": "https://github.com/${{ inputs.child_repo }}.git",
            "reference": "${{ env.COMMIT_SHA }}"
          }'

      # Update dependencies
      - name: Update Composer Lock
        run: |
          cd parent_repo
          composer update --with-all-dependencies

      # Commit and push changes
      - name: Commit and Push Changes
        run: |
          cd parent_repo
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add composer.lock
          git commit -m "Update composer.lock with ${{ inputs.child_repo }} commit ${{ env.COMMIT_SHA }}"
          git push origin ${{ inputs.parent_branch }}
