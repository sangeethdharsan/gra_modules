name: Trigger Dependency Updates

on:
  push:
    branches: 
      - main
      - testing-gra
      - reusable-gra
    paths:
      - 'composer.json'
      - 'composer.lock'

jobs:
  trigger-updates:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger updates in dependent repos
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          # List of repos to update
          repos=("sangeethdharsan/gra_2")
          
          for repo in "${repos[@]}"; do
            echo "Triggering update in $repo"
            
            curl -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/actions/workflows/update-dependencies.yml/dispatches" \
              -d '{
                "ref":"main",
                "inputs":{
                  "source_repo":"${{ github.repository }}",
                  "source_sha":"${{ github.sha }}"
                }
              }'
          done
